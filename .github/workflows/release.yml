name: Build and release CafePOS

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cafepos-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore CafePOS.slnx
      - run: dotnet test CafePOS.slnx --configuration Release --no-restore
      - name: Set build and release version
        shell: pwsh
        run: |
          $isTag = "${{ github.ref_type }}" -eq "tag"
          $isMainPush = "${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main"

          if ($isTag) {
            $version = "${{ github.ref_name }}".TrimStart('v')
            $parsedVersion = $null
            if (-not [version]::TryParse($version, [ref]$parsedVersion)) {
              throw "The release tag '${{ github.ref_name }}' is not a valid numeric version."
            }
            $releaseTag = "${{ github.ref_name }}"
          }
          elseif ($isMainPush) {
            # Re-read tags after entering the release concurrency group so two
            # closely-spaced merges cannot select the same next version.
            git fetch --tags --force
            $latestTag = git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | Select-Object -First 1
            if ($latestTag) {
              $latest = $null
              if (-not [version]::TryParse($latestTag.TrimStart('v'), [ref]$latest)) {
                throw "The latest release tag '$latestTag' is not a valid numeric version."
              }
              $version = "{0}.{1}.{2}" -f $latest.Major, $latest.Minor, ($latest.Build + 1)
            }
            else {
              $version = "1.0.0"
            }
            $releaseTag = "v$version"
          }
          else {
            $version = "1.0.${{ github.run_number }}"
            $releaseTag = ""
          }

          "CAFEPOS_VERSION=$version" >> $env:GITHUB_ENV
          "CAFEPOS_RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "CAFEPOS_SHOULD_RELEASE=$($isTag -or $isMainPush)" >> $env:GITHUB_ENV
      - run: dotnet publish src/CafePOS.Desktop/CafePOS.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$env:CAFEPOS_VERSION --output artifacts/CafePOS-win-x64
      - shell: pwsh
        run: Compress-Archive -Path artifacts/CafePOS-win-x64/* -DestinationPath artifacts/CafePOS-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CafePOS-win-x64
          path: artifacts/CafePOS-win-x64.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: env.CAFEPOS_SHOULD_RELEASE == 'True'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CAFEPOS_RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: artifacts/CafePOS-win-x64.zip
          generate_release_notes: true
