name: Build and release CafePOS

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore CafePOS.slnx
      - run: dotnet test CafePOS.slnx --configuration Release --no-restore
      - name: Set release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "CAFEPOS_VERSION=$version" >> $env:GITHUB_ENV
      - run: dotnet publish src/CafePOS.Desktop/CafePOS.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=$env:CAFEPOS_VERSION --output artifacts/CafePOS-win-x64
      - shell: pwsh
        run: Compress-Archive -Path artifacts/CafePOS-win-x64/* -DestinationPath artifacts/CafePOS-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CafePOS-win-x64
          path: artifacts/CafePOS-win-x64.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/CafePOS-win-x64.zip
          generate_release_notes: true
